# A single Alembic database environment configuration.
[alembic]

# path to migration scripts
script_location = backend/app/alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# version location
version_locations = backend/app/alembic/versions

# separator used in revision file names
# version_file_separator = _

# version file naming
# version_name_format = %%(year)s_%%(month)s_%%(day)s_%%(hour)s%%(minute)s%%(second)s_%%(slug)s

# the charset encoding used for SQLAlchemy text output
# sqlalchemy.output_encoding = utf-8

sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]

# post_write_hooks defines scripts or Python functions that are run
# whenever a new revision script is generated.

# Uncomment the line(s) below to run the black code formatter on new
# revision scripts. The hooks section can contain multiple hooks, which
# will be run in order. Hooks specified in this section are run in
# addition to hooks specified in the [post_write_hooks] section of
# alembic.ini.

# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
