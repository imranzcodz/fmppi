name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Install ruff
        run: pip install ruff
      - name: Install frontend deps
        run: npm ci --prefix frontend
      - name: SAST ruff (backend + ml)
        run: ruff check backend ml
      - name: SAST bandit (backend + ml)
        run: bandit -r backend ml -x "*tests*" -f txt -o bandit-report.txt || true
      - name: SAST eslint (frontend)
        run: npm run lint --prefix frontend
      - name: Type check mypy (backend)
        run: mypy backend || true
      - name: Type check tsc (frontend)
        run: npm run typecheck --prefix frontend || true
      - name: npm audit (critical only)
        run: npm audit --audit-level=critical --prefix frontend

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fmppi
          POSTGRES_PASSWORD: fmppi
          POSTGRES_DB: fmpptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fmppi -d fmpptest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff bandit mypy
      - env:
          FMPPI_TEST_DATABASE_URL: postgresql+psycopg2://fmppi:fmppi@localhost:5432/fmpptest
        run: pytest backend/tests --cov=backend --cov-fail-under=80 --cov-report=xml
      - name: SAST scan (bandit)
        run: bandit -r backend -f json -o bandit-report.json || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Lint (eslint)
        run: npm run lint --prefix frontend
      - name: Type check (tsc)
        run: npx tsc --noEmit --prefix frontend || true
      - name: Run frontend tests with coverage
        run: npm run test:coverage --prefix frontend
      - name: Security audit (npm audit, critical only)
        run: npm audit --prefix frontend --audit-level=critical || true

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt
      - name: Lint ruff (ml)
        run: ruff check ml || true
      - name: SAST bandit (ml)
        run: bandit -r ml -x "*tests*" -f txt -o ml-bandit-report.txt || true
      - name: Run ML tests (G1)
        run: pytest ml/tests --cov=ml --cov-fail-under=80 --cov-report=xml
      - name: ML robustness gate (G4)
        run: python ml/eval/robustness.py --gate || true
