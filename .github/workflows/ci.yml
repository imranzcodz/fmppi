name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff bandit mypy
      - name: Lint (ruff)
        run: ruff check backend
      - name: Type check (mypy)
        run: mypy backend || true
      - name: Run backend tests with coverage (G1)
        run: pytest backend/tests --cov=backend --cov-fail-under=80 --cov-report=xml
      - name: SAST scan (bandit)
        run: bandit -r backend -f json -o bandit-report.json || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Lint (eslint)
        run: npm run lint --prefix frontend
      - name: Type check (tsc)
        run: npx tsc --noEmit --prefix frontend || true
      - name: Run frontend tests with coverage
        run: npm test --prefix frontend -- --coverage --coverageReporters=text,lcov
      - name: Security audit (npm audit, critical only)
        run: npm audit --prefix frontend --audit-level=critical || true

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt
      - name: Run ML tests (G1)
        run: pytest ml/tests --cov=ml --cov-fail-under=80 --cov-report=xml
      - name: ML robustness gate (G4)
        run: python ml/eval/robustness.py --gate
